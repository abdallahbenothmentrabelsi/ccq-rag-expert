version: '3.8'

services:
  rag-app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - inngest-dev
    environment:
      - INNGEST_API_BASE=http://inngest-dev:8288
      - INNGEST_BASE_URL=http://inngest-dev:8288
      - INNGEST_EVENT_KEY=local_dev_key
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./uploads:/app/uploads # Pour garder les PDF
    networks:
      - rag-network

  rag-frontend:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://rag-app:8000
      - INNGEST_BASE_URL=http://inngest-dev:8288
      - INNGEST_EVENT_KEY=local_dev_key
    volumes:
      - ./uploads:/app/uploads
    networks:
      - rag-network

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - rag-network

  inngest-dev:
    image: inngest/inngest:latest
    command: inngest dev -u http://rag-app:8000/api/inngest
    ports:
      - "8288:8288"
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
