version: '3.8'

services:
  # Ton Application RAG (Nouveau !)
  rag-app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - inngest-dev
    volumes:
      - ./uploads:/app/uploads # Pour garder les PDF
    networks:
      - rag-network

  # ... (Garde tes services Qdrant et Inngest existants ici) ...
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    networks:
      - rag-network

  inngest-dev:
    image: inngest/inngest
    ports:
      - "8288:8288"
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
